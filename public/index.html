<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Messenger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js02"></script>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col">

  <header class="p-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
    <h1 class="text-xl font-bold text-indigo-400">⚡ SaaS Messenger</h1>
    <div class="flex gap-3 items-center">
      <input id="user-name-input" type="text" value="Polzovatel" class="bg-gray-700 px-3 py-1 rounded text-sm outline-none border border-gray-600 focus:border-indigo-500">
      <button id="btn-pro" class="bg-gradient-to-r from-amber-500 to-red-500 text-white px-3 py-1 rounded text-sm font-semibold">
        💱 Kupit Pro
      </button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <aside class="w-1/4 bg-gray-800 border-r border-gray-700 flex flex-col">
      <div class="p-3 border-b border-gray-700 flex gap-2">
        <input id="new-room-input" type="text" placeholder="Nazvanie komnaty" class="w-full bg-gray-700 px-3 py-1 rounded text-sm outline-none border border-gray-600">
        <button id="btn-create-room" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1 rounded text-sm font-bold">+</button>
      </div>
      <div id="rooms-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
    </aside>

    <main class="flex-1 flex flex-col bg-gray-900">
      <div class="p-3 bg-gray-800 border-b border-gray-700 font-bold text-gray-300" id="current-room-title">
        Vyberite komnatu
      </div>

      <div id="messages-list" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center text-gray-500 mt-10">Vyberite chat sleva, chtoby nachat obshchenie</div>
      </div>

      <div class="p-3 bg-gray-800 border-t border-gray-700 flex gap-2">
        <input id="message-input" type="text" placeholder="Napishite soobshchenie..." class="flex-1 bg-gray-700 px-4 py-2 rounded-lg outline-none border border-gray-600 focus:border-indigo-500">
        <button id="btn-send-message" class="bg-indigo-600 hover:bg-indigo-700 px-5 py-2 rounded-lg font-bold">Otpravit</button>
      </div>
    </main>
  </div>

  <script>
    const BACKEND_URL = window.location.origin;
    const SUPABASE_URL = "https://bjggkhhjjgcltfssghwg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqZ2draGhqamdjbHRmc3NnaHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjc1NjksImV4cCI6MjEwNDYwMzU2OX0.FK-EUr1ZVrlEizriAAeORNP1lAUdDoGRAP6neGFeYtc";

    const supabase = (window.supabase && SUPABASE_URL.includes("supabase.co")) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
      : null;

    let activeRoomId = null;
    let userId = "user_" + Math.random().toString(36).substring(2, 9);

    async function loadRooms() {
      try {
        const res = await fetch(BACKEND_URL + "/api/rooms");
        const rooms = await res.json();
        
        const list = document.getElementById("rooms-list");
        list.innerHTML = "";
        if (Array.isArray(rooms)) {
          rooms.forEach(room => {
            const btn = document.createElement("button");
            btn.className = "w-full text-left px-3 py-2 rounded hover:bg-gray-700 text-sm font-medium transition";
            btn.innerText = "# " + room.name;
            btn.onclick = () => selectRoom(room.id, room.name);
            list.appendChild(btn);
          });
        }
      } catch (err) {
        console.error("Oshibka zagruzki komnat:", err);
      }
    }

    async function selectRoom(roomId, roomName) {
      activeRoomId = roomId;
      document.getElementById("current-room-title").innerText = "# " + roomName;
      
      try {
        const res = await fetch(BACKEND_URL + "/api/rooms/" + roomId + "/messages");
        const messages = await res.json();
        renderMessages(messages);
        subscribeToRealtime(roomId);
      } catch (err) {
        console.error("Oshibka zagruzki soobshcheniy:", err);
      }
    }

    function renderMessages(messages) {
      const list = document.getElementById("messages-list");
      list.innerHTML = "";
      if (Array.isArray(messages)) {
        messages.forEach(msg => {
          const div = document.createElement("div");
          div.className = "bg-gray-800 p-3 rounded-lg max-w-lg";
          div.innerHTML = "0div class=\"text-xs text-indigo-400 font-bold mb-1\">" + (msg.user_name || "Anonim") + "</div><div class=\"text-sm text-gray-200\">" + (msg.text || "") + "</div>";
          list.appendChild(div);
        });
      }
      list.scrollTop = list.scrollHeight;
    }

    function subscribeToRealtime(roomId) {
      if (!supabase) return;

      supabase
              .channel("public:messages")
              .on(
                      "postgres_changes",
                      { event: "INSERT", schema: "public", table: "messages", filter: `room_id=eq.${roomId}` },
                      payload => {
                        const list = document.getElementById("messages-list");
                        const div = document.createElement("div");
                        div.className = "bg-gray-800 p-3 rounded-lg max-w-lg";

                        // Создаем содержимое с использованием шаблонных строк
                        div.innerHTML = `
          <div class="text-xs text-indigo-400 font-bold mb-1">
            ${payload.new.user_name || "Anonim"}
          </div>
          <div class="text-sm text-gray-200">
            ${payload.new.text || ""}
          </div>
        `;

                        list.appendChild(div);
                        list.scrollTop = list.scrollHeight; // Скроллим вниз
                      }
              )
              .subscribe();
    }

    document.getElementById("btn-send-message").onclick = async function() {
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      const userName = document.getElementById("user-name-input").value;
      if (!text || !activeRoomId) return;

      await fetch(BACKEND_URL + "/api/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roomId: activeRoomId, userId, userName, text })
      });

      input.value = "";
    };

    document.getElementById("btn-create-room").onclick = async function() {
      const input = document.getElementById("new-room-input");
      const name = input.value.trim();
      if (!name) return;

      await fetch(BACKEND_URL + "/api/rooms", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });

      input.value = "";
      loadRooms();
    };

    document.getElementById("btn-pro").onclick = async function() {
      try {
        const res = await fetch(BACKEND_URL + "/api/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if (data.url) window.location.href = data.url;
      } catch (err) {
        console.error("Oshibka oplaty:", err);
      }
    };

    loadRooms();
  </script>
</body>
</html>
